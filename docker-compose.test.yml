name: iam-platform-test

# Isolated, throw-away databases for the backend e2e suite (data lives in tmpfs).
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam_password
      POSTGRES_DB: iam_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iam -d iam_test']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
